<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 724" width="400" height="724" role="img" aria-label="アプリを作る流れ"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans JP, Ume Gothic, sans-serif" font-size="14" text-anchor="middle"><rect x="10" y="10" width="240" height="40" rx="10" fill="#ffffff" stroke="#bdb7aa" stroke-width="1.5"/><text x="130" fill="#1c2420" font-size="13"><tspan x="130" y="27">1 AI とのチャットの履歴から、</tspan><tspan x="130" y="44">何度も頼むことを見つける</tspan></text><rect x="10" y="72" width="240" height="40" rx="10" fill="#dff1ec" stroke="#0f766e" stroke-width="1.5"/><text x="130" y="97" fill="#1c2420">2 今あるアプリを探す</text><path d="M130 52 V69" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 64 L130 70 L135 64" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="10" y="134" width="240" height="40" rx="20" fill="#f1ede3" stroke="#bdb7aa" stroke-width="1.5"/><text x="130" y="159" fill="#1c2420">不満はあるか</text><path d="M252 154 H282" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M276 149 L283 154 L276 159" stroke="#0f766e" stroke-width="2" fill="none"/><text x="267" y="147" font-size="12" fill="#5d6763">無い</text><rect x="286" y="130" width="104" height="48" rx="10" fill="#f1ede3" stroke="#bdb7aa" stroke-width="1.5"/><text x="338" y="150" font-size="13" fill="#1c2420">そのアプリ</text><text x="338" y="167" font-size="13" fill="#1c2420">を使う</text><path d="M130 114 V131" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 126 L130 132 L135 126" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="10" y="196" width="240" height="40" rx="10" fill="#dff1ec" stroke="#0f766e" stroke-width="1.5"/><text x="130" y="221" fill="#1c2420">3 どう良くするかを考える</text><path d="M130 176 V193" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 188 L130 194 L135 188" stroke="#0f766e" stroke-width="2" fill="none"/><text x="150" y="190" font-size="12" fill="#5d6763" text-anchor="start">ある</text><rect x="10" y="258" width="240" height="40" rx="20" fill="#f1ede3" stroke="#bdb7aa" stroke-width="1.5"/><text x="130" y="283" fill="#1c2420">4 要望か、自分で作るか</text><path d="M252 278 H282" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M276 273 L283 278 L276 283" stroke="#0f766e" stroke-width="2" fill="none"/><text x="267" y="271" font-size="12" fill="#5d6763">要望</text><rect x="286" y="254" width="104" height="48" rx="10" fill="#f1ede3" stroke="#bdb7aa" stroke-width="1.5"/><text x="338" y="274" font-size="13" fill="#1c2420">開発者に</text><text x="338" y="291" font-size="13" fill="#1c2420">要望を書く</text><path d="M130 238 V255" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 250 L130 256 L135 250" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="10" y="320" width="240" height="40" rx="10" fill="#dff1ec" stroke="#0f766e" stroke-width="1.5"/><text x="130" y="345" fill="#1c2420">5 今あるアプリの課題を集める</text><path d="M130 300 V317" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 312 L130 318 L135 312" stroke="#0f766e" stroke-width="2" fill="none"/><text x="150" y="314" font-size="12" fill="#5d6763" text-anchor="start">自作</text><rect x="10" y="382" width="240" height="40" rx="10" fill="#dff1ec" stroke="#0f766e" stroke-width="1.5"/><text x="130" y="407" fill="#1c2420">6 設計書とマニュアルを作る</text><path d="M130 362 V379" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 374 L130 380 L135 374" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="10" y="444" width="240" height="40" rx="10" fill="#ffffff" stroke="#bdb7aa" stroke-width="1.5"/><text x="130" y="469" fill="#1c2420">7 実装する</text><path d="M130 424 V441" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 436 L130 442 L135 436" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="10" y="506" width="240" height="40" rx="10" fill="#dff1ec" stroke="#0f766e" stroke-width="1.5"/><text x="130" y="531" fill="#1c2420">8 テストする</text><path d="M130 486 V503" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 498 L130 504 L135 498" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="10" y="568" width="240" height="40" rx="20" fill="#f1ede3" stroke="#bdb7aa" stroke-width="1.5"/><text x="130" y="593" fill="#1c2420">直す所はあるか</text><path d="M252 588 H282" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M276 583 L283 588 L276 593" stroke="#0f766e" stroke-width="2" fill="none"/><text x="267" y="581" font-size="12" fill="#5d6763">ある</text><rect x="286" y="564" width="104" height="48" rx="10" fill="#f1ede3" stroke="#bdb7aa" stroke-width="1.5"/><text x="338" y="584" font-size="13" fill="#1c2420">6 に戻って</text><text x="338" y="601" font-size="13" fill="#1c2420">直す</text><path d="M130 548 V565" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 560 L130 566 L135 560" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="10" y="630" width="240" height="40" rx="20" fill="#0f766e"/><text x="130" y="655" fill="#ffffff" font-weight="700">使い始める</text><path d="M130 610 V627" stroke="#0f766e" stroke-width="2" fill="none"/><path d="M125 622 L130 628 L135 622" stroke="#0f766e" stroke-width="2" fill="none"/><text x="150" y="624" font-size="12" fill="#5d6763" text-anchor="start">無い</text><rect x="10" y="698" width="22" height="16" rx="4" fill="#dff1ec" stroke="#0f766e"/><text x="40" y="711" font-size="12" fill="#5d6763" text-anchor="start">アプリの「作る」で Gemini に頼める段</text></g></svg>
