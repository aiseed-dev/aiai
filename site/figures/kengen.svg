  <text class="fm" x="90" y="164">そこまで</text>
  <g class="fhit">
    <rect x="196" y="90" width="44" height="36" rx="6"/><rect x="248" y="90" width="44" height="36" rx="6"/><rect x="300" y="90" width="44" height="36" rx="6"/>
    <rect x="196" y="132" width="44" height="36" rx="6"/><rect x="248" y="132" width="44" height="36" rx="6"/><rect x="300" y="132" width="44" height="36" rx="6"/>
  </g>
  <text class="fm" x="270" y="192">サーバー、バックアップ、全部</text>
