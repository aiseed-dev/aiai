  <text class="ft" x="90" y="38">一般の ID</text>
  <g class="fm-box"><rect x="190" y="10" width="160" height="44" rx="12"/></g>
  <text class="ft strong" x="270" y="38">権限の大きい ID</text>
  <path class="fa-line" d="M90 56 V84"/><path class="fa-head" d="M84 78 L90 86 L96 78"/>
  <path class="fa-line" d="M270 56 V84"/><path class="fa-head" d="M264 78 L270 86 L276 78"/>
  <g class="fb"><rect x="55" y="90" width="70" height="50" rx="8"/></g>
