<svg viewBox="0 0 360 290" role="img" aria-label="AI の得意なことと苦手なことの図">
  <g class="fx"><rect x="10" y="10" width="165" height="40" rx="10"/></g>
  <text class="ft strong" x="92" y="36">得意</text>
  <g class="fm-box"><rect x="185" y="10" width="165" height="40" rx="10"/></g>
  <text class="ft strong" x="267" y="36">苦手</text>
  <g class="fb">
    <rect x="10" y="58" width="165" height="34" rx="8"/><rect x="10" y="98" width="165" height="34" rx="8"/><rect x="10" y="138" width="165" height="34" rx="8"/>
    <rect x="185" y="58" width="165" height="34" rx="8"/><rect x="185" y="98" width="165" height="34" rx="8"/><rect x="185" y="138" width="165" height="34" rx="8"/>
    <rect x="185" y="178" width="165" height="34" rx="8"/><rect x="185" y="218" width="165" height="34" rx="8"/>
  </g>
  <g class="ft small">
    <text x="92" y="80">読んで言葉にする</text><text x="92" y="120">指示どおりに何度でも</text><text x="92" y="160">いるか、いないか</text>
    <text x="267" y="80">細かい認識、速さ</text><text x="267" y="120">同じ答えを返す</text><text x="267" y="160">間違いに気付く</text>
    <text x="267" y="200">責任を持つ</text><text x="267" y="240">現場の知識</text>
